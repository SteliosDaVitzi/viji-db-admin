name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_TELEMETRY_DISABLED: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt && rustup default 1.95.0
      - run: npm --prefix frontend ci
      - run: cargo fmt --manifest-path backend/Cargo.toml --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Sample API smoke test
        shell: bash
        run: |
          backend/target/release/webdb &
          backend_pid=$!
          NITRO_HOST=127.0.0.1 NITRO_PORT=34616 node frontend/.output/server/index.mjs &
          frontend_pid=$!
          trap 'kill "$frontend_pid" "$backend_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:34616/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          npm run test:smoke
