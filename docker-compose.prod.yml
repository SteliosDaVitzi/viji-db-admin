services:
  backend:
    build: ./backend
    environment:
      WEBDB_SECURE_COOKIES: ${WEBDB_SECURE_COOKIES:-false}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  frontend:
    build: ./frontend
    environment:
      NUXT_API_BASE: http://backend:34617
    ports:
      - 127.0.0.1:34616:34616
    depends_on:
      - backend
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:34616/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
