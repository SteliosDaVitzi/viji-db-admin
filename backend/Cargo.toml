[package]
name = "dbsaur"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "DBsaur, a local database workspace for PostgreSQL, MySQL, MariaDB, and SQL Server"
repository = "https://github.com/SteliosDaVitzi/web-db-tool"
publish = false

[[bin]]
name = "dbsaur"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "mysql", "sqlite", "json"] }
aes-gcm = "0.10.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"

tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73", "rustls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["compat"] }
sqlparser = { version = "0.63", features = ["visitor"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
