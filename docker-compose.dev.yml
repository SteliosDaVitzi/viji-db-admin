services:
  backend:
    image: cgr.dev/chainguard/rust:latest-dev
    working_dir: /app
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["cargo run --locked"]
    environment:
      WEBDB_BIND: 0.0.0.0:34617
      WEBDB_STORE_PATH: /var/lib/webdb/connections.sqlite
      WEBDB_VAULT_KEY: ${WEBDB_VAULT_KEY:?Set WEBDB_VAULT_KEY in .env to a persistent 64-character hex key}
    volumes:
      - ./backend:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
      - dev-connections:/var/lib/webdb
  frontend:
    image: cgr.dev/chainguard/node:latest-dev
    working_dir: /app
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      NUXT_API_BASE: http://backend:34617
      NUXT_TELEMETRY_DISABLED: 1
    ports:
      - 127.0.0.1:34616:34616
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
      - frontend-nuxt:/app/.nuxt
    depends_on:
      - backend
volumes:
  cargo-registry:
  cargo-target:
  frontend-modules:
  frontend-nuxt:
  dev-connections:
