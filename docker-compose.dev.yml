services:
  backend:
    image: rust:1.95-bookworm
    working_dir: /app
    command: cargo run --locked
    environment:
      WEBDB_BIND: 0.0.0.0:34617
    volumes:
      - ./backend:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/app/target
  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      NUXT_API_BASE: http://backend:34617
      NUXT_TELEMETRY_DISABLED: 1
    ports:
      - 127.0.0.1:34616:34616
    volumes:
      - ./frontend:/app
      - frontend-modules:/app/node_modules
      - frontend-nuxt:/app/.nuxt
    depends_on:
      - backend
  postgres:
    image: postgres:18-bookworm
    profiles: [sample-db]
    environment:
      POSTGRES_USER: webdb
      POSTGRES_DB: playground
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/sample.sql:/docker-entrypoint-initdb.d/sample.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U webdb -d playground"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cargo-registry:
  cargo-target:
  frontend-modules:
  frontend-nuxt:
  postgres-data:
